<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#41567b">
  <meta name="description" content="Convite de casamento de Jaqueline e Jadson — 18 de dezembro de 2026.">
  <title>Jaqueline &amp; Jadson · Nosso casamento</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 80px; }
    body { margin: 0; background: #e9edf3; color: #304568; font-family: Georgia, serif; }
    .toolbar { position: sticky; top: 0; z-index: 2; display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 10px 22px; padding: 12px; background: #fafbfdf5; box-shadow: 0 2px 12px #30456818; }
    button { font: 14px system-ui, sans-serif; }
    button { padding: 10px 18px; border: 1px solid #41567b; border-radius: 24px; background: #41567b; color: white; cursor: pointer; }
    main { max-width: 810px; margin: 18px auto; }
    .page { position: relative; margin: 0 0 18px; box-shadow: 0 4px 24px #30456818; }
    .page img { display: block; width: 100%; height: auto; }
    .hotspot { position: absolute; display: block; border-radius: 4px; }
    .hotspot:hover { background: #41567b12; }
    :focus-visible { outline: 3px solid #ad8136; outline-offset: 4px; }
    .open { left: 38.8295%; top: 46.3848%; width: 21.3889%; height: 11.9792%; border-radius: 50%; }
    .rsvp { left: 19.5453%; top: 59.3236%; width: 60.5556%; height: 1.4063%; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    footer { padding: 8px 16px 28px; text-align: center; font-size: 15px; }
    @media (max-width: 600px) { main { margin-top: 0; } .page { margin-bottom: 10px; } }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header class="toolbar" aria-label="Controles do convite">
    <button id="music-toggle" type="button" aria-controls="music" aria-pressed="false">♫ Tocar música</button>
    <span id="music-status" class="sr-only" role="status" aria-live="polite"></span>
  </header>
  <main aria-label="Convite de casamento de Jaqueline e Jadson">
    <h1 class="sr-only">Casamento de Jaqueline e Jadson</h1>
    <!-- Páginas renderizadas do PDF original. Os links mantêm suas posições proporcionais. -->
    <section class="page" aria-label="Capa do convite">
      <img src="pagina-1.webp" width="1013" height="1800" alt="O início do nosso para sempre… Clique no selo para abrir o convite." fetchpriority="high">
      <a class="hotspot open" href="#convite" aria-label="Abrir a segunda página do convite"></a>
    </section>
    <section class="page" id="convite" aria-label="Detalhes do casamento" tabindex="-1">
      <img src="pagina-2.webp" width="1013" height="1800" alt="Jaqueline e Jadson convidam para seu casamento em 18 de dezembro de 2026, sexta-feira, às 16h30, na Igreja Matriz Nossa Senhora da Conceição. Recepção: Fundo de Quintal. Confirme sua presença até 1º de dezembro." loading="lazy">
      <a class="hotspot rsvp" href="https://wa.me/558892294300?text=Confirmo%20minha%20presen%C3%A7a%20no%20casamento%21" target="_blank" rel="noopener" aria-label="Confirmar presença pelo WhatsApp até 1º de dezembro"></a>
    </section>
  </main>
  <footer>Com carinho, Jaqueline &amp; Jadson</footer>
  <audio id="music" src="background-sound.mpeg" autoplay loop preload="metadata"></audio>
  <script>
    const music = document.getElementById('music');
    const toggle = document.getElementById('music-toggle');
    const status = document.getElementById('music-status');
    let userPaused = false;
    music.volume = 0.4;

    function updateMusic() {
      toggle.textContent = music.paused ? '♫ Tocar música' : 'Ⅱ Pausar música';
      toggle.setAttribute('aria-pressed', String(!music.paused));
    }

    async function playMusic(explicit = false) {
      try {
        await music.play();
        status.textContent = '';
      } catch (error) {
        if (explicit) status.textContent = 'Não foi possível iniciar a música. Tente novamente.';
      }
      updateMusic();
    }

    toggle.addEventListener('click', () => {
      if (music.paused) {
        userPaused = false;
        playMusic(true);
      } else {
        userPaused = true;
        music.pause();
      }
    });
    // O toque no selo também permite iniciar o áudio quando o autoplay é bloqueado.
    document.querySelector('.open').addEventListener('click', () => {
      if (music.paused && !userPaused) playMusic();
    });
    music.addEventListener('play', updateMusic);
    music.addEventListener('pause', updateMusic);
    music.addEventListener('error', () => {
      status.textContent = 'Não foi possível carregar a música.';
      updateMusic();
    });
    playMusic();
  </script>
</body>
</html>
